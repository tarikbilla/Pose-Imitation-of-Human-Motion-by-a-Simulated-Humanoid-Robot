# Pipeline runtime configuration.
# All keys are optional; defaults live in the Python code.

input:
  # 0 = first webcam on Linux/macOS. Use a file path like "data/sample.mp4" to replay.
  source: 0
  # PRD FR-1a: capture at Full HD. MeTRAbs rescales internally, so this costs
  # capture/copy bandwidth rather than inference time -- drop to 1280x720 if the
  # capture chain becomes the bottleneck.
  width: 1920
  height: 1080
  # Mirror the camera horizontally so the skeleton tracks selfie-style.
  flip_horizontal: true

pose:
  use_metrabs: true
  # TF-Hub SavedModel URL (zip) or a local path to an already-extracted
  # SavedModel dir. Default is EfficientNetV2-S ("eff2s"): a real-time-oriented
  # speed/accuracy balance. Swap for "metrabs_eff2l_y4" (more accurate, slower)
  # or "metrabs_mob3s_y4"/"metrabs_rn18_y4" (faster, less accurate) -- see
  # https://github.com/isarandi/metrabs/blob/master/docs/MODELS_6_DATASETS.md
  model_url: "https://omnomnom.vision.rwth-aachen.de/data/metrabs/metrabs_eff2s_y4.zip"
  # Skeleton joint convention MeTRAbs should output.
  #
  # "" is the model's FULL 122-joint superset, and it is the default because the
  # hand markers live only there: NAO's WristYaw and its sixteen finger motors
  # have nothing to track without a thumb and a finger point. (ElbowYaw does not
  # need them -- the forearm's own direction fixes it -- so that one works under
  # coco_19 too.)
  #
  # It costs nothing. Every named skeleton is a plain index gather out of this
  # superset, measured at 152.1 ms/call against coco_19's 152.4 ms, so the
  # argument selects joints rather than changing the inference. And it moves
  # nothing: src/perception/landmarks.py pins each of the 19 body landmarks to
  # the exact superset joint coco_19 selects (they are the `_cmu_panoptic`
  # markers, NOT the same-named SMPL joints a few centimetres away -- see "THE
  # ALIAS TRAP" there, and tests/test_landmarks.py, which pins it).
  #
  # Set back to coco_19 to drop hand tracking; nothing else changes.
  skeleton: ""
  # Field of view (degrees, along the larger image side) assumed for an
  # uncalibrated webcam -- used both for MeTRAbs' own inference and for
  # projecting 3D points back to pixels for the HUD overlay. A rough guess,
  # not a real calibration; tune per-camera if absolute scale matters.
  default_fov_degrees: 55.0
  # Confidence threshold for MeTRAbs' built-in YOLOv4 person detector.
  detector_threshold: 0.3
  # Test-time augmentation passes per detection. MeTRAbs' own default is 5
  # (more accurate, slower); 1 favors the pipeline's real-time budget.
  num_aug: 1
  # This pipeline drives a single robot from a single human -- cap detections
  # to 1 to skip inference work on any other people in frame.
  max_detections: 1
  # Frames between full person-detections. MeTRAbs' detect_poses runs YOLOv4 AND
  # the pose network; measured here that is 75.9 ms/frame, of which the detector
  # alone is 39.7 ms -- 52% of the budget, spent re-finding a person who moved a
  # few pixels. Reusing the previous frame's joints as the box costs 36.2 ms for
  # bit-identical output (max difference 0.00 mm), which is the difference
  # the difference between 12.1 and 16.0 FPS end-to-end on a live subject, for a
  # median joint error of 6.8 mm (p95 120 mm). Measured: interval 3 gives 17.7
  # FPS but a p95 of 330 mm, and interval 5 gives NO extra speed with a 232 mm
  # median -- so 2 is the sweet spot, not something larger. 1 = detect always.
  detect_interval: 2
  # Largest median per-joint jump (mm) between consecutive frames before a pose
  # from the tracked box is disbelieved and a full re-detection is run instead.
  # estimate_poses has no detector, so given a stale box it will happily return a
  # confident skeleton of an empty room; this is what stops the robot chasing a
  # phantom after you walk away. Measured: 0 phantom poses at every interval.
  max_joint_jump_mm: 300.0
  # Smoothing of raw 3D keypoints (MeTRAbs, unlike MediaPipe, does not smooth
  # across frames itself). This used to be a fixed-alpha EMA, whose group delay
  # is (1-alpha)/alpha samples NO MATTER what the subject is doing: measured at
  # this pipeline's real rate of 14.3 FPS (70.1 ms/frame), alpha 0.5 cost 70 ms
  # -- 47% of runtime.latency_budget_ms below, spent before inference is even
  # counted, and visible as the robot lagging the human.
  #
  # The 1e ("One Euro") filter makes the cutoff track speed instead, so the
  # delay is spent only while the subject is still. See src/utils/filtering.py.
  smoothing:
    # Cutoff (Hz) approached when the subject is motionless. Raise it if a HELD
    # pose still jitters; lowering it buys smoothness at rest for free, because
    # a still subject has no motion to delay.
    min_cutoff: 1.0
    # How hard speed opens the cutoff, in Hz per (mm/s) -- keypoints are in
    # MILLIMETRES, so a brisk limb runs 1000-2000 mm/s and 0.005 turns that into
    # +5 to +10 Hz. Sampling at 14.3 FPS puts Nyquist at 7.2 Hz, so that range
    # is the difference between "smoothed" and "pass-through". RAISE THIS FIRST
    # if the robot still feels late.
    beta: 0.005
    # Cutoff (Hz) for the velocity estimate itself, so one noisy frame cannot
    # punch the filter wide open. Rarely needs changing.
    d_cutoff: 1.0
  # Refuse to start on a machine with no GPU visible to TensorFlow rather than
  # silently falling back to a much-too-slow CPU run. Only relevant when
  # use_metrabs is true.
  require_gpu: true
  # MUST be false to enable real human detection via MeTRAbs.
  # When true, uses synthetic fallback with fixed landmarks (not tracking humans).
  allow_synthetic_fallback: false

retargeting:
  smoothing_alpha: 0.35

runtime:
  initial_fps: 30
  min_fps: 25
  max_fps: 100
  fps_step: 5
  latency_budget_ms: 150
  max_frames: 0   # 0 = unlimited

webots_bridge:
  enabled: true
  host: 127.0.0.1
  port: 8765

webots:
  # Start Webots on the project world as part of `python run.py`, so one command
  # brings up the whole demo (PRD FR-9 / acceptance criterion 1). An already-open
  # Webots is attached to rather than duplicated, so leaving this on is safe even
  # when following the "open Webots first" flow in docs/RUN_INSTRUCTIONS.md.
  # Override per-run with --launch-webots / --no-launch-webots.
  launch: true
  # Path to the world file; empty = main/worlds/<project>.wbt.
  world: null
  # Seconds to let the world load before the pipeline starts streaming. UDP is
  # connectionless, so frames sent before the controller binds its socket are
  # dropped on the floor rather than queued.
  startup_delay_s: 4.0
  # Passed to Webots as --mode. "realtime" so the simulation actually plays:
  # Webots reopens a world in whatever run state it was saved in, and a world
  # saved while paused never steps, so the controller never binds its socket.
  mode: realtime

# Real-time walking / turning (Python side: cue extraction + streaming).
#
# This side reports *what the human is doing*: marching cadence/phase and the
# torso yaw angle. What the ROBOT does with that -- pre-balanced walk clips, the
# in-place march engine, or per-leg pose imitation -- is decided controller-side
# by LEG_CONTROL in
# main/controllers/pose_imitation_controller/pose_imitation_controller.py.
#
# Per-leg lower-body imitation (squat, single-leg lift) needs no configuration
# here: it is driven straight from the streamed landmarks by the controller.
walk:
  enabled: true        # stream the gait + body-yaw command in the UDP packet
  cue_window_s: 1.3    # history window for the signal AMPLITUDE (s)
  # Separate, longer window for counting the signal's crossings. It has to be
  # longer: requiring two crossings inside the 1.3 s amplitude window imposes a
  # cadence floor of 1/(2*1.3) = 0.385 Hz, which is 2.6x the walk_cadence_min_hz
  # the controller itself asks for -- and measured over a recorded session the
  # histogram of crossings-per-window peaked at exactly ONE. That single gate,
  # not the amplitude and not the confidence, held "march" to 1.1% of frames and
  # made walking impossible to request. At 3.0 s the floor drops to 0.167 Hz.
  cross_window_s: 3.0
  # Amplitude window for the STOP decision, and so the stop latency itself:
  # max-min cannot fall until the window has emptied of motion. Split from
  # cue_window_s because starting and stopping want opposite things -- starting
  # wants long evidence, stopping wants none. Measured by replaying
  # logs/run_20260908_130043 against acausal ankle-speed ground truth, this one
  # number moved the mean stop latency 1210 -> 487 ms and false-march time
  # 51.4 -> 34.2 s. DO NOT lower it below 0.8: at 0.6 and under it starts
  # reading mid-stride as a stop and chops one walk into 1.5-1.8 pieces, each
  # costing a clip restart, a prepare ramp and a clip->pose handover. See the
  # table in GaitCueExtractor's docstring.
  stop_window_s: 0.8
  amp_start: 0.08      # normalized knee-swing amplitude to START marching
  amp_stop: 0.05       # below this -> STOP (hysteresis; bias to standing still)
  cue_conf_min: 0.6    # min visible lower-body fraction to trust a gait reading
  # Consecutive low-confidence frames tolerated before the cadence evidence is
  # thrown away. cue_conf_min is compared against a QUANTISED visibility
  # fraction, so a single mis-detected ankle used to wipe the crossing history
  # and force the robot to re-earn the two-crossing start gate (~1.7 s) -- the
  # "walks, stops, walks again" stutter. Idle is still reported on every such
  # frame; only the forgetting waits.
  cue_conf_grace_frames: 2

logging:
  output_dir: logs
